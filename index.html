<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fem's Eitjes"><title>Fem's Eitjes</title>
<style>
:root{--bg:#fff8ef;--card:#fff;--ink:#342c25;--muted:#7a7067;--accent:#eda33d;--soft:#f7dfb6;--green:#e3f4df;--red:#fde6e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:4;background:#fff8eff2;backdrop-filter:blur(8px);padding:14px;border-bottom:1px solid #eadfce}h1{margin:0;font-size:21px}header p{margin:3px 0 0;color:var(--muted);font-size:12px}
main{max-width:720px;margin:auto;padding:12px 12px 100px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
button{border:0;border-radius:12px;padding:11px 8px;background:var(--soft);font:inherit;font-weight:800;color:var(--ink)}button.active{background:var(--accent);color:#fff}button.danger{background:var(--red)}button.muted{background:#eee8df}
.summary{background:var(--ink);color:#fff;padding:13px;border-radius:15px;line-height:1.45;font-size:14px;margin-bottom:11px}.street{font-size:18px;font-weight:850;margin:20px 3px 7px}
.card{background:var(--card);padding:13px;border-radius:15px;margin:8px 0;box-shadow:0 2px 9px #50300010}.card.done{background:var(--green)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.addr{font-size:20px;font-weight:850}small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}label{font-size:13px;font-weight:700}input{font:inherit}input[type=number],select{width:66px;padding:9px;border:1px solid #d8cab6;border-radius:10px;background:#fff;font:inherit}input[type=checkbox]{width:23px;height:23px;vertical-align:middle}
.pack{display:flex;align-items:center;gap:5px;background:#fff7e8;border:1px solid #efddbd;padding:7px;border-radius:11px}.pack b{font-size:14px}
.modebar{display:flex;gap:7px;margin-bottom:10px}.modebar button{flex:1}.form{background:white;padding:13px;border-radius:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 90px;gap:8px}.grid .wide{grid-column:1/-1}.grid input{padding:9px;border:1px solid #d8cab6;border-radius:10px}
.manageBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.manageCard{display:flex;align-items:center;justify-content:space-between;gap:10px}
.manageInfo{min-width:0;flex:1}
.manageBtns{margin-top:0;flex-wrap:nowrap}
.orderNo{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;background:#f7dfb6;font-size:12px;font-weight:850;margin-right:8px}
.streetHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px}
.streetHead .street{margin:0}
.streetActions{display:flex;gap:5px}
.streetActions button{padding:7px 9px;font-size:12px}
.manageHelp{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 2px 12px}.tiny{padding:7px 9px;font-size:12px}.history{background:white;padding:12px;border-radius:14px;margin:8px 0}.history small{display:block}
footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e8ddd0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:11px;text-align:center;color:var(--muted)}
</style></head><body>
<header><h1>🥚 Fem's Eitjes</h1><p>Bezorgronde · eieren & stroopwafels</p></header><main>
<nav><button id="b-eggs" onclick="tab('eggs')">🥚 Eieren</button><button id="b-waffles" onclick="tab('waffles')">🧇 Wafels</button><button id="b-manage" onclick="tab('manage')">⚙️ Beheer</button></nav>
<div id="view"></div></main><footer>Gegevens worden op deze telefoon bewaard.</footer>
<script>
const DEFAULTS=[{"id": 1, "street": "Amstelstroom", "num": "101", "note": ""}, {"id": 2, "street": "Amstelstroom", "num": "116", "note": ""}, {"id": 3, "street": "Amstelstroom", "num": "99", "note": ""}, {"id": 4, "street": "Amstelstroom", "num": "112", "note": ""}, {"id": 5, "street": "Amstelstroom", "num": "106", "note": ""}, {"id": 6, "street": "Amstelstroom", "num": "98", "note": ""}, {"id": 7, "street": "Amstelstroom", "num": "94", "note": ""}, {"id": 8, "street": "Amstelstroom", "num": "92", "note": ""}, {"id": 9, "street": "Amstelstroom", "num": "88", "note": ""}, {"id": 10, "street": "Amstelstroom", "num": "85", "note": ""}, {"id": 11, "street": "Amstelstroom", "num": "83", "note": ""}, {"id": 12, "street": "Amstelstroom", "num": "70", "note": ""}, {"id": 13, "street": "Amstelstroom", "num": "75", "note": ""}, {"id": 14, "street": "Amstelstroom", "num": "86", "note": ""}, {"id": 15, "street": "Amstelstroom", "num": "82", "note": ""}, {"id": 16, "street": "Amstelstroom", "num": "76", "note": ""}, {"id": 17, "street": "Amstelstroom", "num": "80", "note": ""}, {"id": 18, "street": "Amstelstroom flat", "num": "32", "note": "begane grond"}, {"id": 19, "street": "Amstelstroom flat", "num": "41", "note": "flat 2"}, {"id": 20, "street": "Amstelstroom flat", "num": "45", "note": "flat 3"}, {"id": 21, "street": "Amstelstroom flat", "num": "49", "note": "flat 4"}, {"id": 22, "street": "Amstelstroom flat", "num": "54", "note": "flat 5 · eerst 54 bellen, anders 45"}, {"id": 23, "street": "Amstelstroom flat", "num": "58", "note": "flat 6"}, {"id": 24, "street": "Berkelstroom", "num": "113", "note": ""}, {"id": 25, "street": "Berkelstroom", "num": "115", "note": ""}, {"id": 26, "street": "Coloradostroom", "num": "25", "note": ""}, {"id": 27, "street": "Coloradostroom", "num": "4", "note": ""}, {"id": 28, "street": "Coloradostroom", "num": "15", "note": ""}, {"id": 29, "street": "Coloradostroom", "num": "11", "note": ""}, {"id": 30, "street": "Coloradostroom", "num": "9", "note": ""}, {"id": 31, "street": "Coloradostroom", "num": "2", "note": ""}, {"id": 32, "street": "Hunzestroom", "num": "2", "note": ""}, {"id": 33, "street": "Hunzestroom", "num": "4", "note": ""}, {"id": 34, "street": "Hunzestroom", "num": "8", "note": ""}, {"id": 35, "street": "Hunzestroom", "num": "10", "note": ""}, {"id": 36, "street": "Hunzestroom", "num": "12", "note": ""}, {"id": 37, "street": "Hunzestroom", "num": "24", "note": ""}, {"id": 38, "street": "Hunzestroom", "num": "25", "note": ""}, {"id": 39, "street": "Hunzestroom", "num": "15", "note": ""}, {"id": 40, "street": "Hunzestroom", "num": "7", "note": ""}, {"id": 41, "street": "Hunzestroom", "num": "5", "note": ""}, {"id": 42, "street": "Hunzestroom", "num": "3", "note": ""}];
let A=load('fem_addr6',DEFAULTS), E=load('fem_eggs6',{}), W=load('fem_waf6',{}), H=load('fem_hist6',[]), current='eggs', wm='order';
function load(k,d){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(){localStorage.setItem('fem_addr6',JSON.stringify(A));localStorage.setItem('fem_eggs6',JSON.stringify(E));localStorage.setItem('fem_waf6',JSON.stringify(W));localStorage.setItem('fem_hist6',JSON.stringify(H))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function groups(){let g=[];A.forEach(a=>{let x=g.find(z=>z.s===a.street);if(!x){x={s:a.street,a:[]};g.push(x)}x.a.push(a)});return g}
function qtyOptions(v){v=+v||0;let x='';for(let i=0;i<=9;i++)x+=`<option value="${i}" ${i===v?'selected':''}>${i}</option>`;return x}
function tab(t){current=t;['eggs','waffles','manage'].forEach(x=>document.getElementById('b-'+x).classList.toggle('active',x===t));render()}
function eSet(id,k,v){E[id]??={six:0,ten:0,done:false};E[id][k]=k==='done'?v:Math.max(0,+v||0);save();renderEggs()}
function renderEggs(){let done=A.filter(a=>E[a.id]?.done).length,six=A.reduce((s,a)=>s+(+E[a.id]?.six||0),0),ten=A.reduce((s,a)=>s+(+E[a.id]?.ten||0),0),eggs=six*6+ten*10;
let x=`<div class=summary><b>${done} van ${A.length} adressen gehad</b><br>${six} doosjes van 6 · ${ten} doosjes van 10 · <b>${eggs} eieren</b></div><button onclick=newWeek()>＋ Nieuwe eierenweek</button>`;
groups().forEach(g=>{x+=`<div class=street>${esc(g.s)}</div>`;g.a.forEach(a=>{let d=E[a.id]||{six:0,ten:0,done:false};x+=`<div class="card ${d.done?'done':''}"><div class=top><div><div class=addr>${esc(a.num)}</div>${a.note?`<small>${esc(a.note)}</small>`:''}</div><label>Klaar <input type=checkbox ${d.done?'checked':''} onchange="eSet(${a.id},'done',this.checked)"></label></div><div class=row><div class=pack><b>6 🥚</b><select onchange="eSet(${a.id},'six',this.value)">${qtyOptions(d.six)}</select></div><div class=pack><b>10 🥚</b><select onchange="eSet(${a.id},'ten',this.value)">${qtyOptions(d.ten)}</select></div></div></div>`})});document.getElementById('view').innerHTML=x}
function wSet(id,k,v){W[id]??={asked:false,qty:0,delivered:false,paid:false};W[id][k]=k==='qty'?Math.max(0,+v||0):v;save();renderWaffles()}
function renderWaffles(){let total=A.reduce((s,a)=>s+(+W[a.id]?.qty||0),0),open=A.filter(a=>(+W[a.id]?.qty||0)>0&&!W[a.id]?.delivered).length;
let x=`<div class=modebar><button class="${wm==='order'?'active':''}" onclick="wm='order';renderWaffles()">📝 Bestellen</button><button class="${wm==='deliver'?'active':''}" onclick="wm='deliver';renderWaffles()">🚶 Bezorgen</button></div><div class=summary><b>${total} pakken besteld</b><br>${open} bestelling(en) nog bezorgen</div>${wm==='order'?'<button onclick=newWaffle()>＋ Nieuwe stroopwafelactie</button>':''}`;
groups().forEach(g=>{let arr=wm==='deliver'?g.a.filter(a=>(+W[a.id]?.qty||0)>0):g.a;if(!arr.length)return;x+=`<div class=street>${esc(g.s)}</div>`;arr.forEach(a=>{let d=W[a.id]||{asked:false,qty:0,delivered:false,paid:false};x+=`<div class="card ${d.delivered?'done':''}"><div class=addr>${esc(a.num)}</div>${a.note?`<small>${esc(a.note)}</small>`:''}<div class=row>${wm==='order'?`<label>Gevraagd <input type=checkbox ${d.asked?'checked':''} onchange="wSet(${a.id},'asked',this.checked)"></label><label>Aantal <select onchange="wSet(${a.id},'qty',this.value)">${qtyOptions(d.qty)}</select></label>`:`<b>${d.qty} pak(ken)</b><label>Bezorgd <input type=checkbox ${d.delivered?'checked':''} onchange="wSet(${a.id},'delivered',this.checked)"></label><label>Betaald <input type=checkbox ${d.paid?'checked':''} onchange="wSet(${a.id},'paid',this.checked)"></label>`}</div></div>`})});document.getElementById('view').innerHTML=x}
function addA(){let s=newStreet.value.trim(),n=newNum.value.trim(),note=newNote.value.trim();if(!s||!n)return alert('Vul straat en huisnummer in.');A.push({id:Date.now(),street:s,num:n,note});save();renderManage()}
function delA(id){if(confirm('Adres verwijderen?')){A=A.filter(a=>a.id!==id);delete E[id];delete W[id];save();renderManage()}}
function moveA(id,d){let i=A.findIndex(a=>a.id===id);if(i<0)return;let street=A[i].street;let ids=A.map((a,idx)=>({a,idx})).filter(x=>x.a.street===street);let pos=ids.findIndex(x=>x.a.id===id),target=pos+d;if(target<0||target>=ids.length)return;let j=ids[target].idx;[A[i],A[j]]=[A[j],A[i]];save();renderManage()}
function moveStreet(street,d){let gs=groups(),pos=gs.findIndex(g=>g.s===street),to=pos+d;if(pos<0||to<0||to>=gs.length)return;[gs[pos],gs[to]]=[gs[to],gs[pos]];A=gs.flatMap(g=>g.a);save();renderManage()}
function renderManage(){let x=`<div class=summary><b>Adressen beheren</b><br>De volgorde hieronder is precies Fem's loopvolgorde.</div><div class=form><b>Adres toevoegen</b><div class=grid style="margin-top:9px"><input id=newStreet placeholder=Straat><input id=newNum placeholder=Huisnr.><input class=wide id=newNote placeholder="Notitie (optioneel)"><button class=wide onclick=addA()>＋ Toevoegen</button></div><div class=manageHelp>Gebruik de pijltjes bij een adres om het binnen dezelfde straat één plek omhoog of omlaag te zetten. Met de pijltjes naast een straatnaam verplaats je de hele straat in de route.</div></div>`;
let nr=1;groups().forEach(g=>{x+=`<div class=streetHead><div class=street>${esc(g.s)}</div><div class=streetActions><button class=muted onclick="moveStreet('${String(g.s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',-1)">↑ straat</button><button class=muted onclick="moveStreet('${String(g.s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',1)">↓ straat</button></div></div>`;g.a.forEach(a=>{x+=`<div class="card manageCard"><div class=manageInfo><span class=orderNo>${nr++}</span><span class=addr>${esc(a.num)}</span>${a.note?`<small>${esc(a.note)}</small>`:''}</div><div class=manageBtns><button class="tiny muted" aria-label="Omhoog" onclick="moveA(${a.id},-1)">↑</button><button class="tiny muted" aria-label="Omlaag" onclick="moveA(${a.id},1)">↓</button><button class="tiny danger" onclick="delA(${a.id})">🗑️</button></div></div>`})});if(H.length){x+='<div class=street>Weekhistorie</div>';H.slice().reverse().slice(0,8).forEach(h=>x+=`<div class=history><b>${esc(h.date)}</b><small>${h.six} × doosje 6 · ${h.ten} × doosje 10 · ${h.eggs} eieren</small></div>`)}document.getElementById('view').innerHTML=x}
function newWeek(){if(!confirm('Nieuwe eierenweek starten?'))return;let six=A.reduce((s,a)=>s+(+E[a.id]?.six||0),0),ten=A.reduce((s,a)=>s+(+E[a.id]?.ten||0),0);if(six||ten)H.push({date:new Date().toLocaleDateString('nl-NL'),six,ten,eggs:six*6+ten*10});E={};save();renderEggs()}
function newWaffle(){if(confirm('Nieuwe stroopwafelactie starten? Oude bestellingen worden gewist.')){W={};save();renderWaffles()}}
function render(){if(current==='eggs')renderEggs();else if(current==='waffles')renderWaffles();else renderManage()}tab('eggs');
</script></body></html>
